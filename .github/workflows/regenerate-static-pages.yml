name: "Regenerate static SEO pages (manual, no full sync)"

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Firebase service account key
        run: |
          cat > "$RUNNER_TEMP/firebase-service-account.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Regenerate static product pages for SEO
        run: python generate_product_pages.py

      - name: Regenerate static brand pages for SEO
        run: python generate_brand_pages.py

      - name: Commit regenerated pages
        run: |
          rm -f _product_sitemap_urls.txt
          git config user.name "pages-bot"
          git config user.email "actions@github.com"
          git add brand/ product/ sitemap.xml
          git diff --cached --quiet || git commit -m "Regenerate static brand/product SEO pages [skip ci]"
          git pull --rebase origin master || true
          git push
