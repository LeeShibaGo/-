name: Daily price check & stock sync

on:
  schedule:
    # 每天 UTC 01:00 = 台灣時間早上 09:00
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    # 2026-08-11 抓到:GitHub Actions 沒特別設定的話,job 預設 6 小時就會被
    # 強制取消(對照 Aug 9、Aug 10 兩次都卡在「Sync all brands' stock and
    # prices」這步、跑滿 6:00:xx 準時被砍,後面連 generate_brand_pages.py
    # 都沒機會跑到,SEO 靜態頁跟著沒更新)。商品數量比當初寫這支
    # workflow 時多很多,現在單趟同步常態性超過 6 小時,拉長上限給足
    # 空間跑完,不然排在同步順序後面的品牌永遠等不到重新對庫存,客人
    # 這邊看到的「已售完自動隱藏」也會一直卡在舊資料。
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2026-08-01 起資料庫規則鎖起來,商品讀寫需要服務帳號(Admin SDK)身分,
      # 不能再用沒有驗證的 REST 端點直接 GET/PUT。金鑰存在 GitHub Secret 裡,
      # 這裡寫成暫存檔,GOOGLE_APPLICATION_CREDENTIALS 是 firebase-admin 官方
      # 會自動讀取的環境變數,設定過之後這個 job 剩下的步驟都不用再處理。
      - name: Write Firebase service account key
        run: |
          cat > "$RUNNER_TEMP/firebase-service-account.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # HONMA(售價)、DESCENTE(現貨/缺貨)都是頁面載入後才用 JS 算出來/
      # 套版,一般的 HTTP 請求抓不到,需要用真的瀏覽器(Playwright)把 JS
      # 跑完再讀畫面上的資料,所以要多這一步下載瀏覽器執行檔,其他品牌
      # 不需要。
      - name: Install Playwright browser (for HONMA and DESCENTE)
        run: python -m playwright install --with-deps chromium

      # 每個品牌各自的庫存/價格同步邏輯見 sync_stock.py 開頭的說明。
      # On、DESCENTE、Lacoste、AAPE 加起來要逐一抓好幾千個商品頁,這步
      # 跑 1.5~2.5 小時屬正常,merge_and_save() 已經處理過中途被其他
      # 寫入蓋掉的風險。
      - name: Sync all brands' stock and prices
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python sync_stock.py

      # 商品/庫存/品牌介紹更新之後,SEO 用的靜態品牌頁面(brand/*/index.html)
      # 跟 sitemap.xml 也要跟著重新產生,不然會顯示過期的商品資訊。
      - name: Regenerate static brand pages for SEO
        run: python generate_brand_pages.py
