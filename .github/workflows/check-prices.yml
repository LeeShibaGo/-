name: Daily price check & stock sync

on:
  schedule:
    # 每天 UTC 01:00 = 台灣時間早上 09:00
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # 2026-08-11 抓到:GitHub Actions 的 GitHub-hosted runner 對單一 job 有
  # 6 小時執行時間的硬性上限,這是平台本身的限制,不是 timeout-minutes
  # 可以往上調的(先前以為調高 timeout-minutes 就能延長,實測兩次手動
  # 重跑都還是準時在 6:00:xx 被砍,證實那個判斷是錯的)。
  #
  # 商品數量比當初寫這支 workflow 時多很多,原本「品牌排一列依序同步」的
  # 寫法現在單趟常態性超過 6 小時,導致排在後面的品牌永遠等不到重新對
  # 庫存——改成每個品牌各自獨立一個 job、平行跑(matrix),個別品牌單獨
  # 抓完全用不到 6 小時(當初這幾個最重的品牌 On/DESCENTE/Lacoste/AAPE
  # 加起來也才 1.5~2.5 小時),互相之間也不用等,同時每個品牌各自的
  # 6 小時預算不會被其他品牌吃掉。sync_stock.py 已經支援
  # `python sync_stock.py <brand關鍵字>` 只跑單一品牌,不用改 sync_stock.py
  # 本身(2026-08-13 新增 3coins,同一套 matrix 機制直接沿用)。
  sync-brand:
    strategy:
      fail-fast: false
      matrix:
        brand:
          - salomon
          - "on"
          - gu
          - uniqlo
          - uha
          - dhc
          - onitsuka
          - honma
          - bape
          - stussy
          - celine
          - aape
          - lacoste
          - jlindeberg
          - descente
          - 3coins
          - polene
          - merries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 2026-08-01 起資料庫規則鎖起來,商品讀寫需要服務帳號(Admin SDK)身分,
      # 不能再用沒有驗證的 REST 端點直接 GET/PUT。金鑰存在 GitHub Secret 裡,
      # 這裡寫成暫存檔,GOOGLE_APPLICATION_CREDENTIALS 是 firebase-admin 官方
      # 會自動讀取的環境變數,設定過之後這個 job 剩下的步驟都不用再處理。
      - name: Write Firebase service account key
        run: |
          cat > "$RUNNER_TEMP/firebase-service-account.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # HONMA(售價)、DESCENTE(現貨/缺貨)、Merries(售價+現貨/缺貨)都是
      # 頁面載入後才用 JS 算出來/套版,一般的 HTTP 請求抓不到,需要用真的
      # 瀏覽器(Playwright)把 JS 跑完再讀畫面上的資料,所以只有這三個品牌
      # 的 job 需要多裝這個,其他品牌不用等這個安裝步驟。
      - name: Install Playwright browser (for HONMA, DESCENTE, Merries)
        if: matrix.brand == 'honma' || matrix.brand == 'descente' || matrix.brand == 'merries'
        run: python -m playwright install --with-deps chromium

      # merge_and_save() 已經處理過中途被其他寫入蓋掉的風險,15 個品牌
      # 平行寫不同的 brand 範圍,彼此不會互蓋。
      - name: Sync this brand's stock and prices
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python sync_stock.py ${{ matrix.brand }}

  # 全部品牌都同步完之後才重新產生 SEO 用的靜態品牌頁面(brand/*/index.html)
  # 跟 sitemap.xml,不然會拿還沒同步完的舊資料生頁面。
  regenerate-pages:
    needs: sync-brand
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Firebase service account key
        run: |
          cat > "$RUNNER_TEMP/firebase-service-account.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Regenerate static brand pages for SEO
        run: python generate_brand_pages.py
