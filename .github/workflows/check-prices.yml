name: Daily price check & stock sync

on:
  schedule:
    # 每天 UTC 01:00 = 台灣時間早上 09:00
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # HONMA 的售價是頁面載入後才用 JS 算出來,一般的 HTTP 請求抓不到,
      # 需要用真的瀏覽器(Playwright)把 JS 跑完再讀畫面上的價格,
      # 所以要多這一步下載瀏覽器執行檔,其他品牌不需要。
      - name: Install Playwright browser (for HONMA)
        run: python -m playwright install --with-deps chromium

      # 每個品牌各自的庫存/價格同步邏輯見 sync_stock.py 開頭的說明。
      # On、DESCENTE、Lacoste、AAPE 加起來要逐一抓好幾千個商品頁,這步
      # 跑 1.5~2.5 小時屬正常,merge_and_save() 已經處理過中途被其他
      # 寫入蓋掉的風險。
      - name: Sync all brands' stock and prices
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python sync_stock.py

      # 商品/庫存/品牌介紹更新之後,SEO 用的靜態品牌頁面(brand/*/index.html)
      # 跟 sitemap.xml 也要跟著重新產生,不然會顯示過期的商品資訊。
      - name: Regenerate static brand pages for SEO
        run: python generate_brand_pages.py
