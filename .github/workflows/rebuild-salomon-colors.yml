name: "One-off: preview rebuild salomon colors"

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = 真的寫入;預設只預覽"
        default: "false"

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Firebase service account key
        run: |
          cat > "$RUNNER_TEMP/firebase-service-account.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Rebuild Salomon colours (preview unless APPLY=1)
        env:
          APPLY: ${{ inputs.apply == 'true' && '1' || '0' }}
        run: python rebuild_salomon_colors.py
