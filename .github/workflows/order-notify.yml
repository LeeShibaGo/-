name: Order LINE notify

on:
  schedule:
    # 每 15 分鐘檢查一次新訂單(GitHub 排程有時會延遲幾分鐘,屬正常)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests firebase-admin

      # 2026-08-01 起訂單讀取需要服務帳號(Admin SDK)身分,見 check-prices.yml
      # 裡同一步驟的說明。
      - name: Write Firebase service account key
        run: |
          cat > "$RUNNER_TEMP/firebase-service-account.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Check new orders
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python check_orders.py

      - name: Commit seen-order record
        run: |
          git config user.name "order-notify-bot"
          git config user.email "actions@github.com"
          git add last_seen_orders.json
          git diff --cached --quiet || git commit -m "Update seen orders [skip ci]"
          git pull --rebase origin master || true
          git push
